[workspace]
resolver = "2"
members = ["crates/arsiv-core", "crates/arsiv-eval", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false
repository = "https://github.com/ZoriaSoft/local-search-ai"

[workspace.dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
base64 = "0.22.1"
blake3 = "1.8.7"
calamine = "0.36.1"
encoding_rs = "0.8.42"
lru = "0.16.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
parking_lot = "0.12"
pdfium-render = { version = "0.9.4", default-features = false, features = ["image_025", "thread_safe", "pdfium_latest"] }
quick-xml = "0.42.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled", "blob"] }
rust-stemmers = "1.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tantivy = "0.26.2"
tempfile = "3"
thiserror = "2.0.21"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
unicode-normalization = "0.1.25"
walkdir = "2.5.0"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"

[profile.release]
lto = "thin"
codegen-units = 1
